[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hcwf"
version = "0.0.1"
description = "Human-Centered Weather Forecasts (HCWF): rainy-season onset detection, benchmarking and blending of forecasts"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

authors = [
  { name = "Bo Dong", email = "bodong@uchicago.edu" }
]

dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "matplotlib",
  "geopandas",
  "netcdf4",
  "scipy",
  "seaborn",
  "regionmask",
  "zarr",
  "cartopy",
  "fsspec==2025.3.2.*",
  "pyyaml>=6.0.3",
  "numba>=0.68.1",
  "threadpoolctl",
  "scikit-learn>=1.3",
  "patsy>=0.5",
  "joblib>=1.3",
  "packaging",
]


[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
hcwf = ["onset/registry/*.yaml", "onset/regions/*.yaml"]

[tool.setuptools.packages.find] 
where = ["."]


[project.optional-dependencies]
dev = [
  "dask",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "jupyterlab",
  "black",
  "ruff",
  "ipython",
  "gcsfs",
]
gpu = [
    "cupy-cuda13x>=14.2.0",
]

[project.scripts]
hcwf-run = "hcwf.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# loadgroup only matters with -n: it keeps tests marked xdist_group (the GPU ones) together on one worker.
# -n is not forced here so that a single test or --testmon (which cannot combine with xdist) still works.
addopts = "--dist loadgroup"
