[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hcwf"
version = "0.0.1"
description = "Human-Centered Weather Forecasts (HCWF): rainy-season onset detection, benchmarking and blending of forecasts"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { text = "MIT" }

authors = [
  { name = "Bo Dong", email = "bodong@uchicago.edu" }
]

dependencies = [
  "numpy",
  "pandas",
  "xarray",
  "matplotlib",
  "geopandas",
  "netcdf4",
  "scipy",
  "seaborn",
  "regionmask",
  "zarr",
  "cartopy",
  "fsspec==2025.3.2.*",
  "pyyaml>=6.0.3",
  "numba>=0.68.1",
  "threadpoolctl",
  "scikit-learn>=1.3",
  "patsy>=0.5",
  "joblib>=1.3",
  "packaging",
]


[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
hcwf = ["onset/registry/*.yaml", "onset/regions/*.yaml"]

[tool.setuptools.packages.find] 
where = ["."]


[project.optional-dependencies]
dev = [
  "dask",
  "pytest",
  "pytest-xdist",
  "pytest-testmon",
  "jupyterlab",
  "black",
  "ruff",
  "pydoclint>=0.6",
  "ipython",
  "gcsfs",
]
docs = [
  "sphinx>=7.2",
  "pydata-sphinx-theme",
  "myst-nb",
]
gpu = [
    "cupy-cuda13x>=14.2.0",
]

[project.scripts]
hcwf-run = "hcwf.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
# loadgroup only matters with -n: it keeps tests marked xdist_group (the GPU ones) together on one worker.
# -n is not forced here so that a single test or --testmon (which cannot combine with xdist) still works.
addopts = "--dist loadgroup"
markers = ["slow: long-running tests (full differential runs, benchmarks, full grids); run with --run-slow"]

[tool.ruff.lint]
# The existing rule set (ruff defaults: E4, E7, E9, F) plus the pydocstyle D rules in numpy convention.
select = ["E4", "E7", "E9", "F", "D"]
# D401 (imperative summary) and D417 (every argument documented) are not in the numpy convention; re-enabled here.
extend-select = ["D401", "D417"]

[tool.ruff.lint.per-file-ignores]
# Packages whose docstrings are not converted yet; keep equal to PENDING in tests/test_docstrings.py (one line each).

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pydoclint]
style = "numpy"
# Docstring types are the single source of rendered types (they carry shape, dtype and meaning, which annotations cannot),
# so signature annotations are optional and are not compared with the docstring.
arg-type-hints-in-docstring = true
arg-type-hints-in-signature = false
check-return-types = false
check-yield-types = false
check-arg-order = true
skip-checking-short-docstrings = false
skip-checking-raises = false
allow-init-docstring = false
check-class-attributes = false
check-style-mismatch = true
show-filenames-in-every-violation-message = true
quiet = true
