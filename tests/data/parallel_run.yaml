# A small run on the tracked demo data for tests/test_parallel.py. The test fills @DEMO@ (demo/data), @OUT@ (a
# temporary folder) and @PARALLEL@ (true or false).
project_name: Parallel equals serial on the demo data
region: india
parallel: @PARALLEL@
observations:
  path: @DEMO@/obs
  file_pattern: "{}.nc"
  variable: RAINFALL
  units: mm
models:
  - name: AIFS
    path: @DEMO@/aifs
    variable: tp
    units: mm
    lead_label: end
onset:
  threshold_years: [2013, 2020]
  forecast_history: none
evaluation:
  start_date: [2015, 5, 1]
  end_date: [2015, 6, 30]
  init_days: [2, 5]
  verification_windows: [[1, 15]]
  tolerances: [3]
  max_forecast_day: 15
  start_year_clim: 2013
  end_year_clim: 2020
  day_bins: [[1, 5], [6, 10], [11, 15]]
output:
  data_dir: @OUT@
  figure_dir: @OUT@/fig
  save_fig: false
  plot_spatial_far_mr_mae: false
  plot_heatmap_bss_auc: false
  plot_reliability: false
  plot_climatology_onset: false
  plot_panel_heatmap_error: false
  plot_panel_heatmap_skill: false
  plot_bar_bss_rpss_auc: false
  show_panel: false
