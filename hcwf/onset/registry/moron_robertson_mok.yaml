status: draft
notes: >
  Citation details should be checked. June 2 is the median date of monsoon onset
  over Kerala (MOK), 1901-2024. It is used because the actual MOK date is unknown
  when forecasting. The dry-spell check is dropped to avoid depending on
  long-lead forecasts.

regions: [india]

