id: moron_robertson_blend
version: 1
title: Moron and Robertson local monsoon onset, as onset_blending reads it
citation: >
  Moron, V. and Robertson, A. W. (2014) Interannual variability of Indian summer
  monsoon rainfall onset date at local scale. Int. J. Climatol., 34, 1050-1061.
wording: TODO paste the original definition text
status: draft
notes: >
  onset_blending's reading of the same paper (its country template, "the original
  Moron-Robertson"), kept apart from moron_robertson, which reads it differently:
  a wet day is MORE than 1 mm (moron_robertson: at least), the wet spell must total
  more than (not at least) the local amount, and the dry window of 10 days under
  5 mm is looked for anywhere in days 1 to 31 counted from the onset day
  (followup_anchor onset_day, follow_days 30; moron_robertson: the 30 days after the
  5-day spell). A day of exactly 1 mm is neither wet nor dry. The local amount is
  the mean 5-day total over 04-01 to 10-31 of each year (onset_blending's default
  climatological threshold), and the search runs to the end of the data (season to
  12-31). Used by `momp-run convert` for configs with this definition; its rain-window
  token `follow` is 30 days there and 31 here, which the converter keeps as a number.

regions: [india]

wet_day: more than 1 mm
dry_day: less than 1 mm

season:
  from: 05-01
  to: 12-31

thresholds:
  thr:
    mean total over: 5 days
    during: 04-01 to 10-31

onset:
  window: 5 days
  require:
    - first day: wet
    - total: more than thr
  reject if:
    - dry window: 10 days with less than 5 mm
      within: days 1 to 31
